# proofreader configuration for Catwork.
#
# Only what differs from the built-in (Flux) defaults is listed here; everything else is stock.
# `proofreader --show-readers <Reader>` prints the effective settings of a reader.

AllReaders:
  Include:
    - 'gamemodes/**/*.lua'                           # nothing outside gamemodes/ is linted
  Exclude:
    - 'gamemodes/catwork/gamemode/thirdparty/**/*'   # md5, netstream, pon, utf8: vendored as-is

Layout/LineLength:
  AutoCorrect: false                     # the fix indents the lines it breaks off with spaces
  Exclude:                               # one record or one sentence per line, whatever its length
    - 'gamemodes/**/language/*.lua'
    - 'gamemodes/cwhl2rp/plugins/books/plugin/items/*.lua'
    - 'gamemodes/cwhl2rp/plugins/voices/plugin/sh_plugin.lua'
    - 'gamemodes/cwhl2rp/schema/libraries/sh_voices.lua'

# --- Clockwork conventions -----------------------------------------------------------------------

Style/DocumentationMethod:
  Enabled: false

Naming/VariableName:
  Enabled: false                         # locals and parameters are lowerCamelCase

Lint/ShadowedLibrary:
  # `player`, `team`, `file` and `sound` are free to use as variable names: the libraries are
  # reachable through the `_player`, `_team`, `_file` and `_sound` aliases.
  Libraries: ['table', 'string', 'math', 'util', 'net', 'hook', 'timer', 'render', 'surface',
              'draw', 'ents', 'game', 'engine', 'input', 'gui', 'vgui', 'http', 'os', 'debug',
              'bit']
